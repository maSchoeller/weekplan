<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>weekplan</title>
<meta name="description" content="Wochenplaner für Ernährung und Training mit Einkaufsliste">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥗%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand">weekplan</span>
    <div class="status" id="statusbar"></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="wrap tabs-inner">
    <button class="tab is-active" data-tab="woche">Woche</button>
    <button class="tab" data-tab="einkauf">Einkauf</button>
    <button class="tab" data-tab="rezepte">Rezepte</button>
    <button class="tab" data-tab="training">Training</button>
    <button class="tab" data-tab="ich">Ich</button>
  </div>
</nav>

<main class="wrap">

  <!-- ══ WOCHE ══ -->
  <section id="panel-woche" class="panel is-active">
    <div class="bar">
      <button class="btn btn-primary" id="autofill">Woche automatisch füllen</button>
      <button class="btn" id="clearweek">Woche leeren</button>
      <label class="refeed-pick">Refeed-Tag
        <select id="refeedTag">
          <option value="Sa">Samstag</option>
          <option value="So">Sonntag</option>
        </select>
      </label>
    </div>
    <p class="hint" id="wocheHint"></p>
    <div id="wochenraster" class="wochenraster"></div>
  </section>

  <!-- ══ EINKAUF ══ -->
  <section id="panel-einkauf" class="panel">
    <div class="bar">
      <button class="btn btn-toggle is-active" data-liste="woche">Wochenliste</button>
      <button class="btn btn-toggle" data-liste="grundstock">Grundstock</button>
      <button class="btn" id="resetChecks">Haken zurücksetzen</button>
    </div>
    <div id="listeWoche"></div>
    <div id="listeGrundstock" hidden></div>
  </section>

  <!-- ══ REZEPTE ══ -->
  <section id="panel-rezepte" class="panel">
    <div class="bar">
      <button class="btn btn-toggle is-active" data-kat="alle">Alle</button>
      <button class="btn btn-toggle" data-kat="fruehstueck">Frühstück</button>
      <button class="btn btn-toggle" data-kat="mittag">Mittag</button>
      <button class="btn btn-toggle" data-kat="abend">Abend</button>
      <label class="portion-pick">Portionen
        <input type="number" id="rezeptPortionen" min="1" max="10" step="1" value="1">
      </label>
    </div>
    <div id="rezepteListe"></div>
  </section>

  <!-- ══ TRAINING ══ -->
  <section id="panel-training" class="panel">
    <div class="bar">
      <label class="phase-pick">Phase
        <select id="phaseSelect"></select>
      </label>
    </div>
    <div id="trainingInhalt"></div>
  </section>

  <!-- ══ ICH ══ -->
  <section id="panel-ich" class="panel">
    <div class="card">
      <h2>Deine Werte</h2>
      <p class="hint">Diese Zahlen liegen ausschließlich in diesem Browser (localStorage). Sie werden nirgendwo hochgeladen und stehen nicht im öffentlichen Code.</p>
      <div class="formgrid">
        <label>Gewicht (kg)<input type="text" inputmode="decimal" id="f-gewicht" placeholder="z. B. 97,4"></label>
        <label>Zielgewicht (kg)<input type="text" inputmode="decimal" id="f-ziel" placeholder="z. B. 85"></label>
        <label>Größe (cm)<input type="number" id="f-groesse" step="1" min="120" max="230"></label>
        <label>Alter (Jahre)<input type="number" id="f-alter" step="1" min="14" max="100"></label>
        <label>Zieltermin<input type="date" id="f-zieltermin"></label>
        <label>Proteinfaktor (g pro kg Zielgewicht)<input type="text" inputmode="decimal" id="f-protein" placeholder="z. B. 2,0"></label>
        <label>Tempo (kg pro Woche)<input type="text" inputmode="decimal" id="f-tempo" placeholder="aus Phase, z. B. 0,9"></label>
      </div>
      <div class="bar" style="margin-top:12px">
        <button class="btn" id="tempoReset">Tempo aus der Phase übernehmen</button>
      </div>
      <div id="tempoHinweis"></div>
    </div>

    <div class="card">
      <h2>Rechnung</h2>
      <div id="rechnung"></div>
    </div>

    <div class="card">
      <h2>Gewichtsverlauf</h2>
      <div class="bar">
        <input type="date" id="w-datum">
        <input type="text" inputmode="decimal" id="w-kg" placeholder="kg, z. B. 97,4">
        <button class="btn btn-primary" id="w-add">Eintragen</button>
      </div>
      <div id="plateauHinweis"></div>
      <div id="verlauf"></div>
    </div>
  </section>

</main>

<footer class="wrap foot">
  <p>Kein medizinischer Rat. Bei diesem Defizit und Trainingsumfang gehört ein Hausarzt-Check an den Anfang.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
