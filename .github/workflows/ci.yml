name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Die Cosmos-Tests brauchen eine echte Verbindung, die hier niemand haben
      # darf, und laufen darum von Hand — siehe TagebuchInCosmosTests.
      - name: Test
        run: dotnet test Weekplan.slnx --configuration Release --filter "Ablage!=Cosmos"
